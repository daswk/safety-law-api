name: API 동작 점검
on:
  push:
    paths: ['api/**', 'vercel.json', '.github/workflows/api-check.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 배포 대기 후 실제 API 호출
        run: |
          sleep 120
          {
            echo "# API 점검 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
            for q in 위험성평가 "안전 관리비" "굴착 기울기" 벌목 정기안전점검; do
              enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
              body=$(curl -s -m 30 "https://safety-law-api.vercel.app/api/search?query=$enc")
              echo "- $q → $(echo "$body" | python3 -c "import json,sys
          try:
            d=json.load(sys.stdin); r=d.get('results',[])
            print(f\"total={d.get('total')} shown={d.get('shown')} 기준일={d.get('updatedAt')} 첫결과={(r[0]['lawName']+' '+r[0]['articleNo']) if r else '-'}\")
          except Exception as e: print('오류', str(e))")"
            done
            body=$(curl -s -m 30 "https://safety-law-api.vercel.app/api/search?law=$(python3 -c "import urllib.parse;print(urllib.parse.quote('벌목 표준안전 작업지침'))")")
            echo "- [law] 벌목 표준안전 작업지침 → $(echo "$body" | python3 -c "import json,sys;d=json.load(sys.stdin);print('조문', d.get('total'), '시행', d.get('law',{}).get('eff'))")"
            T=$(python3 -c "import urllib.parse,json;print(urllib.parse.quote(json.dumps([['포장',3],['콘크리트',3],['차량계건설기계',1.5],['협착',1.5]],ensure_ascii=False)))")
            P=$(python3 -c "import urllib.parse,json;print(urllib.parse.quote(json.dumps([['산업안전보건기준에 관한 규칙','제38조'],['도로교통법','제69조']],ensure_ascii=False)))")
            body=$(curl -s -m 30 "https://safety-law-api.vercel.app/api/search?query=x&terms=$T&pins=$P")
            echo "- [smart] 콘크리트포장 → $(echo "$body" | python3 -c "import json,sys;d=json.load(sys.stdin);r=d.get('results',[]);print(d.get('mode'),'꼭볼',d.get('pinned'),'건수',d.get('shown'),'첫결과',(r[0]['lawName']+' '+r[0]['articleNo']) if r else '-')")"
            body=$(curl -s -m 30 "https://safety-law-api.vercel.app/api/search")
            echo "- [목록] → $(echo "$body" | python3 -c "import json,sys;d=json.load(sys.stdin);print('법령', len(d.get('laws',[])), '개')")"
          } > data/api-check.md
          cat data/api-check.md
      - run: |
          git config user.name "law-bot"; git config user.email "law-bot@users.noreply.github.com"
          git add data/api-check.md
          git diff --cached --quiet || (git commit -m "API 점검 결과" && git pull -q --rebase origin main && git push)
