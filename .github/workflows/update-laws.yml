name: 법령 자료 갱신

on:
  schedule:
    - cron: '17 18 * * *'   # 매일 03:17 (KST)
  workflow_dispatch: {}      # Actions 탭에서 수동 실행 가능
  push:
    paths:
      - 'targets.json'
      - 'scripts/build-laws.mjs'

permissions:
  contents: write

concurrency:
  group: update-laws
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 법제처에서 법령 받아오기
        env:
          LAW_OC: ${{ secrets.LAW_OC }}
        run: node scripts/build-laws.mjs
      - name: 바뀐 내용이 있으면 저장
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          git add data/laws.json data/report.md
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "법령 자료 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git push
          fi
