name: 법령 명칭 찾기(일회성)
on:
  push:
    paths: ['find.json']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/find-names.mjs
        env: { LAW_OC: '${{ secrets.LAW_OC }}' }
      - run: |
          git config user.name "law-bot"; git config user.email "law-bot@users.noreply.github.com"
          git add data/find-report.md
          git diff --cached --quiet || (git commit -m "명칭 찾기 결과" && git push)
